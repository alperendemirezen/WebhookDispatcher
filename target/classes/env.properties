
auto.offset.reset=earliest

bootstrap.servers=localhost:9092
topic=test-transaction


# Kafka poll timeout in milliseconds
timeoutMS=100
# Retry interval in minutes
retry.period.min=3
# Retry interval in minutes (limited or unlimited)
retry.mode=limited
# Max retry attempts (used in limited mode)
retry.count=3
# Specifies how often (in minutes) the merge thread should run.
merge.thread.interval.minutes=60
# Determines at what intervals to check the topic list
check.topics.interval.minutes=60